[package]
name = "app"
description = "Game / sim entry point: Bevy app, window, input, rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wmc"
path = "src/main.rs"

[features]
# `make` builds with this: Bevy as one shared library, relinked once. Never in release.
dev = ["bevy/dynamic_linking"]

[dependencies]
sim-core.workspace = true
bevy.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
fontdue.workspace = true

[dev-dependencies]
criterion.workspace = true

[lints]
workspace = true

[[bench]]
name = "render"
harness = false
