[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

# Pre-approved dependencies. Reference them from a crate with `foo.workspace = true`.
# Add new ones here first so every crate agrees on a version.
[workspace.dependencies]
# --- parallelism / concurrency ---
rayon = "1.10"             # data-parallel iterators, join, scope (default for CPU-bound work)
crossbeam = "0.8"          # channels, scoped threads, epoch GC, lock-free queues
parking_lot = "0.12"       # faster Mutex/RwLock than std, no poisoning
atomic_float = "1"         # AtomicF32/F64 when a lock is overkill
# --- data layout / numerics ---
bytemuck = { version = "1", features = ["derive"] }  # safe Pod casting for flat buffers / FFI
glam = "0.30"              # SIMD vec/mat math
wide = "0.7"               # portable SIMD types
# --- rng (deterministic, seedable, fast) ---
rand = "0.9"
rand_xoshiro = "0.7"
# --- window / rendering ---
winit = "0.30"             # window + input events (event-driven ApplicationHandler)
softbuffer = "0.4"         # presents a CPU u32 framebuffer in a window, no GPU stack
fontdue = "0.9"            # TTF rasterizer; builds the glyph atlas once per cell size
# --- utilities ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# --- dev / bench ---
criterion = { version = "0.6", features = ["html_reports"] }
proptest = "1"
# --- internal crates ---
sim-core = { path = "crates/sim-core" }
zig-kernels = { path = "crates/zig-kernels" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Things that matter for a hot-loop sim:
large_stack_arrays = "warn"
needless_pass_by_value = "warn"
# Things that are noise for a game:
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1            # a sim at opt-level 0 is unusable; 1 keeps debug info + fast builds

[profile.dev.package."*"]
opt-level = 3            # dependencies always optimized

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1                # line tables for profilers (perf / samply / Instruments)
panic = "abort"

# `cargo build --profile fast` : release speed, dev-like build times, for iterating on perf
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

[profile.bench]
inherits = "release"
debug = true
